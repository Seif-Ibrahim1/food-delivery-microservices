server:
  port: 8761

spring:
  application:
    name: discovery-service

management:
  tracing:
    sampling:
      probability: 1.0 # Log 100% of requests for debugging (will change it to 10% in production if I remembered)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    # The registry shouldn't register with itself
    register-with-eureka: false
    fetch-registry: false
  server:
    # Shorten wait time for development environment
    wait-time-in-ms-when-sync-empty: 5