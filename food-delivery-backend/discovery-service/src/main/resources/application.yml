server:
  port: 8761

spring:
  application:
    name: discovery-service
  config:
    # "optional" means: "Try to connect, but don't crash if server is down"
    import: "optional:configserver:http://localhost:8888/"
  

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/