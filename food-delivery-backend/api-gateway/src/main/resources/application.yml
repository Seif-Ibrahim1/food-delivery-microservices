server:
  port: 8080 # Standard port for Gateways

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # 1. Automatic Discovery Routes (Backup: /order-service/orders)
      discovery:
        locator:
          enabled: true # auto-create routes from Eureka
          lower-case-service-id: true # /user-service instead of /USER-SERVICE
          
      # 2. Explicit Clean Routes (Primary: /orders)
      routes:
        - id: order-route
          uri: lb://order-service  # "lb" = Load Balanced (via Eureka)
          predicates:
            - Path=/orders/** # If path starts with /orders...
          # No StripPrefix needed here because Order Controller is ALSO /orders

        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: restaurant-route
          uri: lb://restaurant-service
          predicates:
            - Path=/restaurants/**
        
management:
  tracing:
    sampling:
      probability: 1.0 # Log 100% of requests for debugging (will change it to 10% in production if I remembered)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/