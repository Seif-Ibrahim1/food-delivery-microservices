server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/food_delivery_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  threads:
    virtual:
      enabled: true  # Performance Boost

management:
  tracing:
    sampling:
      probability: 1.0 # Log 100% of requests for debugging (will change it to 10% in production if I remembered)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      # We will reference it in Java
      external:
        registerHealthIndicator: true
        slidingWindowSize: 10              # Look at the last 10 calls
        minimumNumberOfCalls: 5            # Don't trip until at least 5 calls happened
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s        # Wait 5s before checking if service is back
        failureRateThreshold: 50           # Trip if 50% fail
        eventConsumerBufferSize: 10