server:
  port: 8082

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/food_delivery_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  tracing:
    sampling:
      probability: 1.0 # Log 100% of requests for debugging (will change it to 10% in production if I remembered)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/