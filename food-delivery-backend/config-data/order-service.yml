server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/food_delivery_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Enable Virtual Threads
  threads:
    virtual:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      # We will reference it in Java
      external:
        registerHealthIndicator: true
        slidingWindowSize: 10              # Look at the last 10 calls
        minimumNumberOfCalls: 5            # Don't trip until at least 5 calls happened
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s        # Wait 5s before checking if service is back
        failureRateThreshold: 50           # Trip if 50% fail
        eventConsumerBufferSize: 10
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true